[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundarytransport"
version = "0.1.0"
description = "BoundaryTransport: Open-Space-Conserving Boundary Uncertainty Transfer for Long-Tailed Open-Set Recognition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
boundarytransport = "boundarytransport.cli:main"

[tool.setuptools.packages.find]
include = ["boundarytransport*"]
